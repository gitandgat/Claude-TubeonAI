<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Hooks — Access</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap');
    * { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    h1 { font-family: 'Playfair Display', serif; }
    body {
      background-color: #f5f0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 0.75rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 { color: #1a1a1a; margin: 0 0 0.5rem; font-size: 1.75rem; }
    p { color: #666; font-size: 0.875rem; margin: 0 0 1.5rem; }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #1a1a1a;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #b8860b;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
    }
    .error { color: #c53030; font-size: 0.875rem; margin-top: 0.75rem; min-height: 1.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Viral Hooks</h1>
    <p>Enter the access code from your welcome email.</p>
    <form id="loginForm">
      <input type="text" id="accessCode" placeholder="xxxx-xxxx-xxxx" autofocus required />
      <button type="submit">Enter</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const accessCode = document.getElementById('accessCode').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessCode })
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json();
        errorEl.textContent = data.error || 'Invalid access code';
      }
    });
  </script>
</body>
</html>
