<!doctype html><html><head><style>
    :root {
        --bg: #0d0d0d;
        --amber: #e8a838;
        --teal: #3db8b0;
        --white: #f5f0e8;
        --muted: #8a8a8a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: var(--bg);
        color: var(--white);
        font-family: 'Georgia', serif;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .slide {
        width: 1080px;
        height: 1920px;
        padding: 100px 90px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
    }
    </style></head><body>
<div class="slide">
  <div style="position:absolute;top:0;left:0;width:100%;height:12px;background:#3db8b0"></div>
<div style="position:absolute;bottom:80px;left:90px;right:90px;display:flex;align-items:center;gap:16px;">
  <div style="width:8px;height:8px;border-radius:50%;background:#e8a838"></div>
  <span style="font-family:system-ui,sans-serif;font-size:26px;letter-spacing:0.12em;color:#8a8a8a;text-transform:uppercase;">Crosswalk Wisdom</span>
</div>
  <div style="margin-top:-40px;">
    <div style="font-size:64px;font-family:Georgia,serif;line-height:1.35;color:#f5f0e8;">What you can do with what you have —<br><br>that's a much more interesting question than whether you're allowed to stop.</div>
  </div>
</div></body></html>
