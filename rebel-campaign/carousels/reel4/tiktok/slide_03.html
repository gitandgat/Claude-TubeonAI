<!doctype html><html><head><style>
    :root {

        --muted: #8a8a8a;

    * { margin: 0; padding: 0; box-sizing: border-box; }

        height: 1920px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

        padding: 100px 90px;

        position: relative;
    }
    </style></head><body>
<div class="slide">

<div style="position:absolute;bottom:80px;left:90px;right:90px;display:flex;align-items:center;gap:16px;">

  <span style="font-family:system-ui,sans-serif;font-size:26px;letter-spacing:0.12em;color:#8a8a8a;text-transform:uppercase;">Crosswalk Wisdom</span>
</div>
  <div style="display:flex;gap:20px;width:100%;margin-top:-40px;"><div style="flex:1;padding:40px 44px;background:rgba(255,255,255,0.04);border-top:6px solid #8a8a8a;">

  <div style="font-size:48px;font-family:Georgia,serif;color:#f5f0e8;line-height:1.3;margin-bottom:16px;">• Freedom</div><div style="font-size:48px;font-family:Georgia,serif;color:#f5f0e8;line-height:1.3;margin-bottom:16px;">• Options</div><div style="font-size:48px;font-family:Georgia,serif;color:#f5f0e8;line-height:1.3;margin-bottom:16px;">• Permission to choose</div>
</div><div style="flex:1;padding:40px 44px;background:rgba(255,255,255,0.04);border-top:6px solid #e8a838;">
