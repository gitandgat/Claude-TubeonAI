<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: #1e1e1e;
    font-family: 'Playfair Display', serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 1080px; height: 1080px;
    padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  /* stripe motif */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg, #d4a574 0%, #2ec4b6 100%);
  }
  /* subtle corner texture */
  .card::after {
    content: '';
    position: absolute;
    bottom: -120px; right: -120px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,165,116,0.07) 0%, transparent 70%);
  }
  .tag {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #2ec4b6;
  }
  .hook {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }
  .hook-line-1 {
    font-size: 82px;
    font-weight: 400;
    line-height: 1.05;
    color: #f0ede8;
  }
  .hook-line-2 {
    font-size: 82px;
    font-weight: 700;
    line-height: 1.05;
    color: #d4a574;
  }
  .sub {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 400;
    color: #a0a0a0;
    line-height: 1.5;
    max-width: 760px;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 32px;
  }
  .brand {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
  }
  .accent-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #d4a574;
    display: inline-block;
    margin-left: 8px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="tag">THE CROSSWALK COMMUNITY</div>
  <div class="hook">
    <div class="hook-line-1">Done pretending</div>
    <div class="hook-line-2">you're fine?</div>
  </div>
  <div>
    <div class="sub">This is the space for IMGs in Canada who are ready to ask the real question.</div>
    <div class="footer">
      <div class="brand">crosswalkwisdom.com</div>
      <span class="accent-dot"></span>
    </div>
  </div>
</div>
</body>
</html>
