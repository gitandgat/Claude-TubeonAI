<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:600px; height:600px; overflow:hidden; background:#1A1A1A; display:flex; align-items:center; justify-content:center; }
  .card { width:600px; height:600px; background:#1A1A1A; position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:48px 52px; overflow:hidden; }
  .accent-top { position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#D4A843 0%,rgba(212,168,67,0.1) 70%,transparent 100%); }
  .accent-left { position:absolute; top:0; left:0; bottom:0; width:4px; background:linear-gradient(180deg,#D4A843 0%,rgba(212,168,67,0.1) 60%,transparent 100%); }
  .bg-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(212,168,67,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(212,168,67,0.03) 1px,transparent 1px); background-size:60px 60px; }
  .glow { position:absolute; top:-60px; right:-60px; width:300px; height:300px; background:radial-gradient(circle,rgba(212,168,67,0.14) 0%,transparent 65%); }
  .price { font-family:'Inter',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#1A1A1A; background:#D4A843; padding:6px 14px; border-radius:2px; margin-bottom:24px; display:inline-block; }
  h1 { font-family:'Playfair Display',Georgia,serif; font-size:44px; font-weight:900; color:#FAF7F2; line-height:1.1; margin-bottom:20px; }
  .sub { font-family:'Inter',sans-serif; font-size:14px; color:rgba(250,247,242,0.4); line-height:1.5; max-width:320px; margin-bottom:32px; }
  .stat { font-family:'Playfair Display',Georgia,serif; font-size:28px; font-weight:900; color:rgba(212,168,67,0.25); }
  .brand { position:absolute; bottom:28px; left:52px; font-family:'Playfair Display',Georgia,serif; font-size:13px; font-weight:700; color:rgba(212,168,67,0.45); }
</style>
</head>
<body>
<div class="card">
  <div class="accent-top"></div>
  <div class="accent-left"></div>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="price">$17</div>
  <h1>Should You<br>Keep Going?</h1>
  <div class="sub">The honest guide for IMGs who are tired of letting sunk costs make the decision for them.</div>
  <div class="stat">97% vs 10–22%</div>
  <div class="brand">Crosswalk Wisdom</div>
</div>
</body>
</html>
