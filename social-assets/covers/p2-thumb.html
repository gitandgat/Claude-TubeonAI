<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:600px; height:600px; overflow:hidden; background:#0F1A23; display:flex; align-items:center; justify-content:center; }
  .card { width:600px; height:600px; background:#0F1A23; position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:48px 52px; overflow:hidden; }
  .accent-top { position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#38BDF8 0%,rgba(56,189,248,0.1) 70%,transparent 100%); }
  .accent-left { position:absolute; top:0; left:0; bottom:0; width:4px; background:linear-gradient(180deg,#38BDF8 0%,rgba(56,189,248,0.1) 60%,transparent 100%); }
  .bg-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(56,189,248,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.03) 1px,transparent 1px); background-size:60px 60px; }
  .glow { position:absolute; top:-60px; right:-60px; width:300px; height:300px; background:radial-gradient(circle,rgba(56,189,248,0.1) 0%,transparent 65%); }
  .price { font-family:'Inter',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#fff; background:#0EA5E9; padding:6px 14px; border-radius:2px; margin-bottom:24px; display:inline-block; }
  h1 { font-family:'Playfair Display',Georgia,serif; font-size:44px; font-weight:900; color:#FAF7F2; line-height:1.1; margin-bottom:20px; }
  .sub { font-family:'Inter',sans-serif; font-size:14px; color:rgba(250,247,242,0.4); line-height:1.5; max-width:320px; margin-bottom:28px; }
  .badge { display:inline-flex; align-items:center; gap:10px; padding:10px 16px; border:1px solid rgba(56,189,248,0.2); border-radius:2px; background:rgba(56,189,248,0.05); }
  .badge-num { font-family:'Playfair Display',Georgia,serif; font-size:28px; font-weight:900; color:#38BDF8; }
  .badge-text { font-family:'Inter',sans-serif; font-size:13px; color:rgba(56,189,248,0.6); }
  .brand { position:absolute; bottom:28px; left:52px; font-family:'Playfair Display',Georgia,serif; font-size:13px; font-weight:700; color:rgba(56,189,248,0.4); }
</style>
</head>
<body>
<div class="card">
  <div class="accent-top"></div>
  <div class="accent-left"></div>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="price">$27</div>
  <h1>The IMG<br>Identity Reset</h1>
  <div class="sub">5 AI prompts for physicians done letting one exam define them.</div>
  <div class="badge">
    <div class="badge-num">5</div>
    <div class="badge-text">AI Prompts · 30 min</div>
  </div>
  <div class="brand">Crosswalk Wisdom</div>
</div>
</body>
</html>
