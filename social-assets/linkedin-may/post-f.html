<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post F — The Sunk Cost Trap</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  .card {
    width: 1080px;
    height: 1080px;
    position: relative;
    background-image: url('./images/f-sunk-cost.jpg');
    background-size: cover;
    background-position: center top;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(18,14,10,0.96) 0%,
      rgba(18,14,10,0.78) 40%,
      rgba(18,14,10,0.30) 75%,
      rgba(18,14,10,0.10) 100%
    );
  }

  .accent-left {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, rgba(212,168,67,0.15) 0%, #D4A843 40%, rgba(212,168,67,0.2) 100%);
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 0 88px 72px 92px;
  }

  .tag {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #D4A843;
    background: rgba(212,168,67,0.12);
    border: 1px solid rgba(212,168,67,0.3);
    padding: 7px 16px;
    border-radius: 2px;
    margin-bottom: 36px;
  }

  .hook {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 58px;
    font-weight: 900;
    line-height: 1.1;
    color: #FAF7F2;
    margin-bottom: 28px;
    max-width: 860px;
  }

  .hook em {
    font-style: italic;
    color: #D4A843;
  }

  .sub {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 400;
    color: rgba(250,247,242,0.55);
    line-height: 1.5;
    max-width: 680px;
    margin-bottom: 52px;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: rgba(212,168,67,0.4);
    margin-bottom: 40px;
  }

  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    color: rgba(212,168,67,0.7);
  }

  .author {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: rgba(250,247,242,0.3);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="overlay"></div>
  <div class="accent-left"></div>
  <div class="content">
    <div class="tag">The Sunk Cost Trap</div>
    <div class="hook">The most dangerous number<br>isn't the match rate.<br>It's <em>$18,000.</em></div>
    <div class="divider"></div>
    <div class="sub">The average spent before the first CaRMS rejection.<br>And now it owns your next move.</div>
    <div class="bottom-bar">
      <span class="brand">Crosswalk Wisdom</span>
      <span class="author">Sahawat — IMG, Crossing Guard, Founder</span>
    </div>
  </div>
</div>
</body>
</html>
