<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philosophy Overview - East Meets West</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1080px;
            height: 1080px;
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            width: 100%;
            height: 100%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .header {
            text-align: center;
            z-index: 2;
        }
        .tagline {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d4a574;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }
        .title {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 30px;
            color: #d4a574;
        }
        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #f0ede8;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .concepts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        .concept {
            background: rgba(212, 165, 116, 0.1);
            border-left: 3px solid #d4a574;
            padding: 12px;
            border-radius: 4px;
        }
        .concept-title {
            color: #d4a574;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .footer {
            text-align: center;
            font-family: 'Inter', sans-serif;
            z-index: 2;
        }
        .cta-text {
            font-size: 16px;
            color: #d4a574;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .handle {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        .decoration {
            position: absolute;
            opacity: 0.1;
            color: #d4a574;
        }
        .deco-1 {
            top: 20px;
            right: 30px;
            font-size: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="tagline">Crosswalk Wisdom</div>
            <div class="title">East Meets West</div>
            <div class="subtitle">Western career coaching is broken.<br>Eastern philosophy has the answers.</div>

            <div class="concepts">
                <div class="concept">
                    <span class="concept-title">Kintsugi</span>
                    Brokenness → Beauty
                </div>
                <div class="concept">
                    <span class="concept-title">Ikigai</span>
                    Purpose → Meaning
                </div>
                <div class="concept">
                    <span class="concept-title">Shoshin</span>
                    Expertise → Growth
                </div>
                <div class="concept">
                    <span class="concept-title">Wabi-Sabi</span>
                    Perfect → Imperfect
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="cta-text">Read the Complete Philosophy</div>
            <div class="handle">From the Ward to the World</div>
        </div>
    </div>
    <div class="decoration deco-1">✨</div>
</body>
</html>
