<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikigai - Reason for Being</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1080px;
            height: 1080px;
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            width: 100%;
            height: 100%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .header {
            text-align: center;
            z-index: 2;
        }
        .tagline {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d4a574;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }
        .title {
            font-size: 72px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #d4a574;
        }
        .subtitle {
            font-size: 28px;
            font-weight: 400;
            color: #f0ede8;
            line-height: 1.4;
        }
        .emoji {
            font-size: 120px;
            margin: 40px 0;
            display: block;
        }
        .footer {
            text-align: center;
            font-family: 'Inter', sans-serif;
            z-index: 2;
        }
        .cta-text {
            font-size: 16px;
            color: #d4a574;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .handle {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        .decoration {
            position: absolute;
            opacity: 0.1;
            color: #d4a574;
        }
        .deco-1 {
            top: 20px;
            right: 30px;
            font-size: 200px;
        }
        .deco-2 {
            bottom: 30px;
            left: 40px;
            font-size: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="tagline">Crosswalk Wisdom</div>
            <div class="title">Ikigai</div>
            <div class="emoji">🌸</div>
            <div class="subtitle">You have credentials.<br>Nothing in your body<br>feels alive.<br><br>The question isn't:<br>"How do I make this work?"<br>It's: "What feeds my soul?"</div>
        </div>
        <div class="footer">
            <div class="cta-text">Discover Your Ikigai</div>
            <div class="handle">From the Ward to the World</div>
        </div>
    </div>
    <div class="decoration deco-1">✨</div>
    <div class="decoration deco-2">✨</div>
</body>
</html>
